<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFS Widget-Konfigurator</title>
  <link rel="stylesheet" href="../docs/widget.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #f8f9fa;
      color: #1f1f1f;
    }
    h1 {
      margin: 0;
      padding: .75rem 1.5rem;
      background: #1f1f1f;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 44px);
    }
    .settings {
      overflow-y: auto;
      border-right: 1px solid #e0e0e0;
      background: #fff;
    }
    details { border-bottom: 1px solid #e8eaed; }
    summary {
      padding: .65rem 1rem;
      font-weight: 600;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #1a73e8;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '▼ '; font-size: .55rem; }
    details:not([open]) summary::before { content: '▶ '; }
    .settings-body { padding: .25rem 1rem .75rem; }
    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .35rem 0;
      gap: .5rem;
    }
    .field label { font-size: .83rem; color: #3c4043; flex: 1; }
    .field input[type="color"] {
      width: 38px; height: 26px;
      border: 1px solid #dadce0; border-radius: 4px; padding: 1px; cursor: pointer;
    }
    .field input[type="number"] {
      width: 68px; padding: .28rem .45rem;
      border: 1px solid #dadce0; border-radius: 4px; font-size: .83rem;
    }
    .field input[type="text"] {
      width: 155px; padding: .28rem .45rem;
      border: 1px solid #dadce0; border-radius: 4px; font-size: .83rem;
    }
    .field select {
      padding: .28rem .45rem;
      border: 1px solid #dadce0; border-radius: 4px; font-size: .83rem;
    }
    .toggle { position: relative; display: inline-block; width: 34px; height: 18px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 18px; transition: .2s; cursor: pointer;
    }
    .toggle .slider::before {
      content: ''; position: absolute;
      height: 12px; width: 12px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .toggle input:checked + .slider { background: #1a73e8; }
    .toggle input:checked + .slider::before { transform: translateX(16px); }
    .preview-pane {
      overflow-y: auto;
      padding: 1.25rem 1.25rem 90px;
      background: #f8f9fa;
    }
    .preview-label {
      font-size: .7rem; text-transform: uppercase;
      letter-spacing: .05em; color: #80868b; margin-bottom: .65rem;
    }
    .embed-bar {
      position: fixed;
      bottom: 0; left: 320px; right: 0;
      background: #fff; border-top: 1px solid #e0e0e0;
      padding: .5rem 1rem;
      display: flex; align-items: center; gap: .65rem;
      z-index: 100;
    }
    .embed-bar strong { font-size: .78rem; white-space: nowrap; }
    .embed-bar textarea {
      flex: 1; height: 50px; resize: none;
      font-family: 'Courier New', monospace; font-size: .72rem;
      border: 1px solid #dadce0; border-radius: 4px;
      padding: .35rem .55rem; background: #f8f9fa; color: #333;
    }
    .embed-bar button {
      padding: .45rem .9rem;
      background: #1a73e8; color: #fff;
      border: 0; border-radius: 6px;
      font-size: .83rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .embed-bar button:hover { background: #1557b0; }
  </style>
</head>
<body>

<h1>FFS Widget-Konfigurator</h1>

<div class="layout">
  <div class="settings">

    <details open>
      <summary>Farben &amp; Style</summary>
      <div class="settings-body">
        <div class="field"><label>Akzentfarbe (Button)</label>
          <input type="color" id="cfg-accentColor" value="#ddb357"></div>
        <div class="field"><label>Sternfarbe</label>
          <input type="color" id="cfg-starColor" value="#FBBC04"></div>
        <div class="field"><label>Karten-Hintergrund</label>
          <input type="color" id="cfg-cardBackground" value="#ffffff"></div>
        <div class="field"><label>Eckenradius (px)</label>
          <input type="number" id="cfg-cardBorderRadius" value="12" min="0" max="32"></div>
      </div>
    </details>

    <details open>
      <summary>Karte</summary>
      <div class="settings-body">
        <div class="field"><label>Kartenbreite (px)</label>
          <input type="number" id="cfg-cardWidth" value="300" min="200" max="600"></div>
        <div class="field"><label>Abstand (px)</label>
          <input type="number" id="cfg-cardGap" value="16" min="0" max="48"></div>
        <div class="field"><label>Max. Zeilen</label>
          <input type="number" id="cfg-maxLines" value="8" min="2" max="30"></div>
        <div class="field"><label>Datum anzeigen</label>
          <label class="toggle"><input type="checkbox" id="cfg-showDate" checked><span class="slider"></span></label></div>
        <div class="field"><label>Avatar anzeigen</label>
          <label class="toggle"><input type="checkbox" id="cfg-showAvatar" checked><span class="slider"></span></label></div>
      </div>
    </details>

    <details open>
      <summary>Header</summary>
      <div class="settings-body">
        <div class="field"><label>Header anzeigen</label>
          <label class="toggle"><input type="checkbox" id="cfg-showHeader" checked><span class="slider"></span></label></div>
        <div class="field"><label>CTA-Button anzeigen</label>
          <label class="toggle"><input type="checkbox" id="cfg-showCtaButton" checked><span class="slider"></span></label></div>
        <div class="field"><label>Button-Text</label>
          <input type="text" id="cfg-ctaButtonText" value="Eine Bewertung schreiben"></div>
      </div>
    </details>

    <details open>
      <summary>Navigation</summary>
      <div class="settings-body">
        <div class="field"><label>Pfeile</label>
          <select id="cfg-arrows">
            <option value="desktop">Nur Desktop</option>
            <option value="always">Immer</option>
            <option value="never">Nie</option>
          </select></div>
        <div class="field"><label>Auto-Rotate (Sek, 0=aus)</label>
          <input type="number" id="cfg-autoRotate" value="0" min="0" max="60"></div>
      </div>
    </details>

    <details open>
      <summary>Filter</summary>
      <div class="settings-body">
        <div class="field"><label>Max. Reviews</label>
          <input type="number" id="cfg-maxReviews" value="50" min="1" max="300"></div>
        <div class="field"><label>Mindest-Sterne</label>
          <select id="cfg-minRating">
            <option value="1">Alle</option>
            <option value="3">3&#x2605; und mehr</option>
            <option value="4">4&#x2605; und mehr</option>
            <option value="5">Nur 5&#x2605;</option>
          </select></div>
      </div>
    </details>

    <details open>
      <summary>Performance</summary>
      <div class="settings-body">
        <div class="field"><label>Lazy Load (im Widget)</label>
          <label class="toggle"><input type="checkbox" id="cfg-lazyLoad" checked><span class="slider"></span></label></div>
      </div>
    </details>

  </div>

  <div class="preview-pane">
    <div class="preview-label">Live-Vorschau — lädt echte Reviews von GitHub Pages</div>
    <div id="ffs-google-reviews"></div>
  </div>
</div>

<div class="embed-bar">
  <strong>Embed-Code:</strong>
  <textarea id="embed-code" readonly></textarea>
  <button id="copy-btn">Kopieren</button>
</div>

<script src="../docs/widget.js"></script>
<script>
(function () {
  var GITHUB_BASE = 'https://firefly1502.github.io/rezensionintegrator/';
  var REVIEWS_URL = GITHUB_BASE + 'reviews.json';

  function readConfig() {
    return {
      accentColor:      document.getElementById('cfg-accentColor').value,
      starColor:        document.getElementById('cfg-starColor').value,
      cardBackground:   document.getElementById('cfg-cardBackground').value,
      cardBorderRadius: Number(document.getElementById('cfg-cardBorderRadius').value),
      cardWidth:        Number(document.getElementById('cfg-cardWidth').value),
      cardGap:          Number(document.getElementById('cfg-cardGap').value),
      maxLines:         Number(document.getElementById('cfg-maxLines').value),
      showDate:         document.getElementById('cfg-showDate').checked,
      showAvatar:       document.getElementById('cfg-showAvatar').checked,
      showHeader:       document.getElementById('cfg-showHeader').checked,
      showCtaButton:    document.getElementById('cfg-showCtaButton').checked,
      ctaButtonText:    document.getElementById('cfg-ctaButtonText').value,
      arrows:           document.getElementById('cfg-arrows').value,
      autoRotate:       Number(document.getElementById('cfg-autoRotate').value),
      maxReviews:       Number(document.getElementById('cfg-maxReviews').value),
      minRating:        Number(document.getElementById('cfg-minRating').value),
      lazyLoad:         document.getElementById('cfg-lazyLoad').checked
    };
  }

  function buildEmbedCode(cfg) {
    var embedCfg = {};
    Object.keys(cfg).forEach(function (k) {
      if (k !== 'reviewsUrl' && k !== 'lazyLoad') {
        embedCfg[k] = cfg[k];
      }
    });
    var lines = [];
    Object.keys(embedCfg).forEach(function (k) {
      lines.push('  ' + k + ': ' + JSON.stringify(embedCfg[k]).replace(/<\/script/gi, '<\\/script'));
    });
    return '<div id="ffs-google-reviews"></div>\n' +
      '<link rel="stylesheet" href="' + GITHUB_BASE + 'widget.css">\n' +
      '<script>window.FFS_WIDGET_CONFIG = {\n' + lines.join(',\n') + '\n};<\/script>\n' +
      '<script src="' + GITHUB_BASE + 'widget.js" defer><\/script>';
  }

  function reloadPreview(cfg) {
    var previewCfg = Object.assign({}, cfg, {
      lazyLoad: false,      // Vorschau soll sofort laden
      reviewsUrl: REVIEWS_URL
    });
    window.FFS_WIDGET_CONFIG = previewCfg;
    var mount = document.getElementById('ffs-google-reviews');
    mount.innerHTML = '';
    mount.removeAttribute('style');
    mount.className = '';
    if (typeof window.ffsWidgetBoot === 'function') {
      window.ffsWidgetBoot();
    }
  }

  function update() {
    var cfg = readConfig();
    reloadPreview(cfg);
    document.getElementById('embed-code').value = buildEmbedCode(cfg);
  }

  document.querySelectorAll('[id^="cfg-"]').forEach(function (el) {
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });

  document.getElementById('copy-btn').addEventListener('click', function () {
    var ta = document.getElementById('embed-code');
    var btn = document.getElementById('copy-btn');
    navigator.clipboard.writeText(ta.value).then(function () {
      btn.textContent = 'Kopiert!';
      setTimeout(function () { btn.textContent = 'Kopieren'; }, 2000);
    }).catch(function () {
      ta.select();
      btn.textContent = 'Strg+C drücken';
      setTimeout(function () { btn.textContent = 'Kopieren'; }, 3000);
    });
  });

  update();
})();
</script>

</body>
</html>
