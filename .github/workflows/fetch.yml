name: Fetch Reviews

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fetcher/requirements.txt

      - name: Install dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Run fetcher
        env:
          REVIEWS_SOURCE: business
          PLACE_ID: ChIJZybyS393vUcRmrlk8nxVyuE
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python -m fetcher.fetch

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain docs/reviews.json docs/avatars/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/reviews.json docs/avatars/
            git commit -m "chore(reviews): update reviews.json ($(date -u +%Y-%m-%d))"
            # Rebase vor Push, falls main inzwischen weitergewandert ist
            # (verhindert "non-fast-forward"-Fehler bei parallelen Pushes).
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying…"
              sleep 3
            done
          else
            echo "No changes to reviews.json/avatars — skipping commit."
          fi
